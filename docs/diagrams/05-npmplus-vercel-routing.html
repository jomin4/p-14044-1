<title>npmplus 와 Vercel · 한 도메인 세 목적지</title>
<style>
  :root{
    --canvas:#fdfdfd; --dot:#dcdcdc; --ink:#1e1e1e; --muted:#868e96; --line:#c9c9c9;
    --blue:#1971c2;  --blue-bg:#a5d8ff;
    --red:#e03131;   --red-bg:#ffc9c9;
    --green:#2f9e44; --green-bg:#b2f2bb;
    --amber:#e8890c; --amber-bg:#ffec99;
    --violet:#6741d9;--violet-bg:#d0bfff;
    --card:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --canvas:#121212; --dot:#2b2b2b; --ink:#e3e3e3; --muted:#909296; --line:#3a3a3a;
      --blue:#74c0fc;  --blue-bg:#1b3b5c;
      --red:#ff8787;   --red-bg:#5c2626;
      --green:#69db7c; --green-bg:#1e4529;
      --amber:#ffd43b; --amber-bg:#544217;
      --violet:#b197fc;--violet-bg:#3a2f63;
      --card:#1a1a1a;
    }
  }
  :root[data-theme="dark"]{
    --canvas:#121212; --dot:#2b2b2b; --ink:#e3e3e3; --muted:#909296; --line:#3a3a3a;
    --blue:#74c0fc; --blue-bg:#1b3b5c; --red:#ff8787; --red-bg:#5c2626;
    --green:#69db7c; --green-bg:#1e4529; --amber:#ffd43b; --amber-bg:#544217;
    --violet:#b197fc; --violet-bg:#3a2f63; --card:#1a1a1a;
  }
  :root[data-theme="light"]{
    --canvas:#fdfdfd; --dot:#dcdcdc; --ink:#1e1e1e; --muted:#868e96; --line:#c9c9c9;
    --blue:#1971c2; --blue-bg:#a5d8ff; --red:#e03131; --red-bg:#ffc9c9;
    --green:#2f9e44; --green-bg:#b2f2bb; --amber:#e8890c; --amber-bg:#ffec99;
    --violet:#6741d9; --violet-bg:#d0bfff; --card:#ffffff;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background-color:var(--canvas);
    background-image:radial-gradient(circle, var(--dot) 1.1px, transparent 1.1px);
    background-size:26px 26px;
    color:var(--ink);
    font-family:"Segoe Print","Bradley Hand","Comic Sans MS","Malgun Gothic","Apple SD Gothic Neo",ui-sans-serif,sans-serif;
    line-height:1.65;
  }
  .wrap{max-width:1260px;margin:0 auto;padding:52px 22px 90px;display:flex;flex-direction:column;gap:36px}
  header{display:flex;flex-direction:column;gap:10px;transform:rotate(-.3deg)}
  .kicker{font-size:13px;letter-spacing:.1em;color:var(--muted)}
  h1{margin:0;font-size:clamp(26px,4vw,40px);line-height:1.2;font-weight:700;text-wrap:balance}
  .sub{color:var(--muted);font-size:15px;max-width:62ch}

  .plate{background:var(--card);border:2.2px solid var(--ink);border-radius:14px 12px 15px 11px;
         padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:3px 4px 0 rgba(0,0,0,.10)}
  .plate:nth-of-type(odd){transform:rotate(.16deg)}
  .plate:nth-of-type(even){transform:rotate(-.16deg)}
  .plate-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .num{font-size:14px;font-weight:700;color:var(--canvas);background:var(--ink);
       border-radius:50% 48% 52% 50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}

  .canvas-box{overflow-x:auto}
  svg{display:block;width:100%;min-width:760px;height:auto}
  figure{margin:0;display:flex;flex-direction:column;gap:12px}
  figcaption{font-size:14px;color:var(--muted);max-width:74ch;padding-left:12px;border-left:3px dashed var(--line)}
  figcaption b{color:var(--ink)}

  .sk{filter:url(#rgh)}
  .bx      {fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
  .bx-dash {fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:9 6;stroke-linejoin:round}
  .zn-a    {fill:none;stroke:var(--amber);stroke-width:2.4}
  .zn-b    {fill:none;stroke:var(--blue);stroke-width:2.4}
  .zn-v    {fill:none;stroke:var(--violet);stroke-width:2.4}
  .zn-g    {fill:none;stroke:var(--green);stroke-width:2.4}
  .ar   {fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
  .ar-b {fill:none;stroke:var(--blue);stroke-width:2.4;stroke-linecap:round}
  .ar-v {fill:none;stroke:var(--violet);stroke-width:2.4;stroke-linecap:round}
  .ar-g {fill:none;stroke:var(--green);stroke-width:2.4;stroke-linecap:round}
  .ar-r {fill:none;stroke:var(--red);stroke-width:2.4;stroke-linecap:round}
  .ar-m {fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-dasharray:8 6}
  .xline{fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round}

  .t   {fill:var(--ink);font-size:15px;font-weight:700}
  .ts  {fill:var(--muted);font-size:12.5px}
  .tu  {fill:var(--ink);font-size:14px}
  .tb  {fill:var(--blue);font-size:13px;font-weight:700}
  .tv  {fill:var(--violet);font-size:13px;font-weight:700}
  .ta  {fill:var(--amber);font-size:13px;font-weight:700}
  .tg  {fill:var(--green);font-size:13px;font-weight:700}
  .tr  {fill:var(--red);font-size:13px;font-weight:700}
</style>

<div class="wrap">

  <header>
    <div class="kicker">jomin4.cloud · 라우팅 분담</div>
    <h1>한 도메인, 세 목적지<br>npmplus 와 Vercel 은 서로를 모른다</h1>
    <p class="sub">갈라지는 지점은 DNS 다. 그 뒤로는 각자 다른 회사의 서버가 각자 응답한다.</p>
  </header>

  <!-- ================= PLATE 1 ================= -->
  <section class="plate">
    <div class="plate-head"><span class="num">1</span><h2>이름이 갈라지는 지점 — DNSZi</h2></div>
    <figure>
      <div class="canvas-box">
        <svg viewBox="0 0 1200 700" role="img"
             aria-label="DNSZi에 등록된 세 개의 레코드가 각각 EC2의 npmplus와 Vercel로 갈라지는 구조도">
          <defs>
            <filter id="rgh" x="-6%" y="-6%" width="112%" height="112%">
              <feTurbulence type="fractalNoise" baseFrequency="0.016 0.022" numOctaves="2" seed="11" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
            <marker id="hd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M0,0 L10,5 L0,10" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round"/>
            </marker>
          </defs>

          <g class="sk">
            <rect class="bx" x="50" y="300" width="180" height="90" rx="9"></rect>
            <path class="ar" d="M234,345 L274,345" marker-end="url(#hd)"></path>
            <rect class="zn-g" x="280" y="240" width="250" height="215" rx="11"></rect>
            <path class="ar-b" d="M534,318 C600,318 620,215 674,200" marker-end="url(#hd)"></path>
            <path class="ar-a ar-b" d="M534,358 C600,358 620,300 674,290" marker-end="url(#hd)"></path>
            <path class="ar-v" d="M534,398 C600,398 620,540 674,560" marker-end="url(#hd)"></path>
            <rect class="zn-b" x="680" y="110" width="470" height="320" rx="12"></rect>
            <rect class="bx" x="710" y="165" width="420" height="70" rx="8"></rect>
            <rect class="bx" x="710" y="250" width="420" height="62" rx="8"></rect>
            <rect class="bx-dash" x="710" y="327" width="420" height="62" rx="8"></rect>
            <rect class="zn-v" x="680" y="470" width="470" height="180" rx="12"></rect>
            <rect class="bx" x="710" y="525" width="420" height="80" rx="8"></rect>
          </g>

          <text class="t"  x="140" y="338" text-anchor="middle">브라우저</text>
          <text class="ts" x="140" y="360" text-anchor="middle">이름으로 물어본다</text>

          <text class="tg" x="298" y="268">DNSZi — 권한 네임서버</text>
          <text class="tu" x="298" y="318">A       api   → 3.37.29.175</text>
          <text class="tu" x="298" y="358">A       @     → 3.37.29.175</text>
          <text class="tv" x="298" y="398">CNAME   www   → Vercel</text>
          <text class="ts" x="298" y="428">세 줄이 전부다. 여기서 갈린다</text>

          <text class="tb" x="700" y="140">EC2  3.37.29.175  ·  npmplus  (우리 서버)</text>
          <text class="t"  x="730" y="192">:443   api.jomin4.cloud</text>
          <text class="ts" x="730" y="216">→ p-14044-1_1 : 8080  (스프링부트)</text>
          <text class="t"  x="730" y="276">:443   jomin4.cloud</text>
          <text class="ts" x="730" y="299">→ 301  www.jomin4.cloud  (리다이렉트만)</text>
          <text class="ts" x="730" y="352">:81    npmplus 관리 콘솔</text>
          <text class="ts" x="730" y="375">같은 A 레코드, 포트만 다름</text>

          <text class="tv" x="700" y="500">Vercel  (다른 회사 서버)</text>
          <text class="t"  x="730" y="556">www.jomin4.cloud</text>
          <text class="ts" x="730" y="580">→ Next.js 프론트 배포본</text>

          <text class="ts" x="50" y="682">파란 화살표 = 우리 EC2 로 · 보라 화살표 = Vercel 로</text>
        </svg>
      </div>
      <figcaption>
        루트 도메인을 Vercel 에 넘기지 않은 이유가 여기 있다. <code>@</code> A 레코드 하나가 <b>리다이렉트와 관리 콘솔(:81) 둘 다</b>를 떠받치고 있어서, Vercel 로 옮기면 콘솔 접속이 끊긴다.
      </figcaption>
    </figure>
  </section>

  <!-- ================= PLATE 2 ================= -->
  <section class="plate">
    <div class="plate-head"><span class="num">2</span><h2>사용자가 글 목록을 볼 때 — 브라우저가 두 곳과 각각 대화한다</h2></div>
    <figure>
      <div class="canvas-box">
        <svg viewBox="0 0 1200 700" role="img"
             aria-label="브라우저가 Vercel에서 HTML과 JS를 받고, 그 JS가 다시 브라우저에서 api.jomin4.cloud로 직접 요청을 보내는 구조. Vercel과 EC2는 서로 직접 통신하지 않는다">
          <defs>
            <filter id="rgh2" x="-6%" y="-6%" width="112%" height="112%">
              <feTurbulence type="fractalNoise" baseFrequency="0.016 0.022" numOctaves="2" seed="23" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
            <marker id="hd2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M0,0 L10,5 L0,10" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round"/>
            </marker>
          </defs>

          <g style="filter:url(#rgh2)">
            <rect class="bx" x="55" y="150" width="195" height="370" rx="10"></rect>
            <path class="ar-v" d="M254,205 L474,205" marker-end="url(#hd2)"></path>
            <path class="ar-b" d="M254,470 L474,470" marker-end="url(#hd2)"></path>
            <rect class="zn-v" x="480" y="130" width="340" height="150" rx="11"></rect>
            <rect class="zn-b" x="480" y="380" width="340" height="220" rx="11"></rect>
            <path class="ar-g" d="M824,480 L894,480" marker-end="url(#hd2)"></path>
            <rect class="zn-g" x="900" y="410" width="250" height="150" rx="11"></rect>
            <path class="ar-m" d="M650,286 L650,372"></path>
            <path class="xline" d="M628,308 L672,352"></path>
            <path class="xline" d="M672,308 L628,352"></path>
          </g>

          <text class="t"  x="152" y="300" text-anchor="middle">브라우저</text>
          <text class="ts" x="152" y="324" text-anchor="middle">사용자 PC</text>
          <text class="ts" x="152" y="356" text-anchor="middle">이 안에서</text>
          <text class="ts" x="152" y="378" text-anchor="middle">JS 가 실행된다</text>

          <text class="tv" x="364" y="175" text-anchor="middle">① GET  www.jomin4.cloud</text>
          <text class="ts" x="364" y="232" text-anchor="middle">HTML · JS · CSS 를 받아온다</text>

          <text class="tb" x="364" y="422" text-anchor="middle">② fetch  api.jomin4.cloud/api/v1/posts</text>
          <text class="ts" x="364" y="444" text-anchor="middle">JS 가 브라우저에서 직접 호출</text>
          <text class="ts" x="364" y="502" text-anchor="middle">credentials: include  → 쿠키 동봉</text>

          <text class="tv" x="500" y="162">Vercel</text>
          <text class="t"  x="500" y="200">Next.js 정적 자산 · SSR</text>
          <text class="ts" x="500" y="228">글 데이터는 갖고 있지 않다</text>
          <text class="ts" x="500" y="254">DB 도 모른다</text>

          <text class="tb" x="500" y="412">EC2 · npmplus → 스프링부트</text>
          <text class="t"  x="500" y="452">p-14044-1_1 : 8080</text>
          <text class="ts" x="500" y="480">JSON 만 응답</text>
          <text class="ts" x="500" y="512">CORS 허용 Origin :</text>
          <text class="ts" x="500" y="534">https://www.jomin4.cloud  하나뿐</text>
          <text class="ts" x="500" y="566">화면(HTML)은 만들지 않는다</text>

          <text class="tg" x="918" y="442">MySQL · Redis</text>
          <text class="ts" x="918" y="470">172.18.0.x</text>
          <text class="ts" x="918" y="496">같은 도커 네트워크</text>
          <text class="ts" x="918" y="522">외부에서 접근 불가</text>

          <text class="tr" x="690" y="322">Vercel 과 EC2 는</text>
          <text class="tr" x="690" y="344">서로 통신하지 않는다</text>

          <text class="ts" x="55" y="648">쿠키 domain = jomin4.cloud  →  www 와 api 가 같은 쿠키를 공유한다 (그래서 로그인이 유지된다)</text>
          <text class="ts" x="55" y="676">이 구조라 백엔드는 화면을 모르고, 프론트는 DB 를 모른다 — 각자 따로 배포해도 서로 영향이 없다</text>
        </svg>
      </div>
      <figcaption>
        <b>브라우저가 중개자다.</b> Vercel 은 화면 만드는 재료만 주고, 그 재료(JS)가 사용자 PC 에서 실행되며 우리 EC2 를 직접 호출한다. 그래서 백엔드 CORS 에 <code>www.jomin4.cloud</code> 를 넣어야 하고, 쿠키 도메인을 상위인 <code>jomin4.cloud</code> 로 잡아둔 것이다.
      </figcaption>
    </figure>
  </section>

  <!-- ================= PLATE 3 ================= -->
  <section class="plate">
    <div class="plate-head"><span class="num">3</span><h2>같은 일을 누가 어떻게 하나</h2></div>
    <figure>
      <div class="canvas-box">
        <svg viewBox="0 0 1180 440" role="img"
             aria-label="인증서 발급, 배포, 무중단 전환을 npmplus와 Vercel이 각각 어떻게 처리하는지 비교한 표">
          <defs>
            <filter id="rgh3" x="-6%" y="-6%" width="112%" height="112%">
              <feTurbulence type="fractalNoise" baseFrequency="0.015 0.021" numOctaves="2" seed="31" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
          </defs>
          <g style="filter:url(#rgh3)">
            <rect class="zn-b" x="360" y="60" width="380" height="46" rx="9"></rect>
            <rect class="zn-v" x="770" y="60" width="380" height="46" rx="9"></rect>
            <rect class="bx" x="40"  y="130" width="300" height="80" rx="9"></rect>
            <rect class="bx" x="360" y="130" width="380" height="80" rx="9"></rect>
            <rect class="bx" x="770" y="130" width="380" height="80" rx="9"></rect>
            <rect class="bx" x="40"  y="230" width="300" height="80" rx="9"></rect>
            <rect class="bx" x="360" y="230" width="380" height="80" rx="9"></rect>
            <rect class="bx" x="770" y="230" width="380" height="80" rx="9"></rect>
            <rect class="bx" x="40"  y="330" width="300" height="80" rx="9"></rect>
            <rect class="bx" x="360" y="330" width="380" height="80" rx="9"></rect>
            <rect class="bx" x="770" y="330" width="380" height="80" rx="9"></rect>
          </g>

          <text class="tb" x="550" y="90" text-anchor="middle">npmplus  (우리가 직접 구축)</text>
          <text class="tv" x="960" y="90" text-anchor="middle">Vercel  (완제품)</text>

          <text class="t"  x="60" y="165">인증서</text>
          <text class="ts" x="60" y="188">api · 루트 도메인</text>
          <text class="tu" x="380" y="165">Let's Encrypt 자동 발급</text>
          <text class="ts" x="380" y="188">TLS 탭에서 직접 요청 · 자동 갱신</text>
          <text class="tu" x="790" y="165">자동 발급</text>
          <text class="ts" x="790" y="188">도메인 붙이면 알아서 · 설정 없음</text>

          <text class="t"  x="60" y="265">배포</text>
          <text class="ts" x="60" y="288">코드 → 서버</text>
          <text class="tu" x="380" y="265">GitHub Actions → GHCR → SSM</text>
          <text class="ts" x="380" y="288">워크플로 200줄을 직접 작성</text>
          <text class="tu" x="790" y="265">git push 하면 끝</text>
          <text class="ts" x="790" y="288">빌드 · 배포 전부 자동</text>

          <text class="t"  x="60" y="365">무중단</text>
          <text class="ts" x="60" y="388">교체 중 서비스 유지</text>
          <text class="tu" x="380" y="365">Blue/Green 직접 구현</text>
          <text class="ts" x="380" y="388">헬스체크 후 업스트림 전환</text>
          <text class="tu" x="790" y="365">기본 제공</text>
          <text class="ts" x="790" y="388">새 배포가 준비되면 원자적 전환</text>
        </svg>
      </div>
      <figcaption>
        Vercel 이 한 줄로 해주는 일을 백엔드에서는 <b>직접 만들어야</b> 했다. 이 강의가 19강까지 쓴 시간의 정체가 이 표의 왼쪽 열이다 — 편해서가 아니라, 그 안에서 무슨 일이 일어나는지 알기 위해.
      </figcaption>
    </figure>
  </section>

</div>
