name: deploy

# =========================
# 전역 환경변수
# =========================
env:
  IMAGE_REPOSITORY: p-14044-1        # GHCR 이미지 이름 (소유자 제외)
  CONTAINER_1_NAME: p-14044-1_1      # 슬롯 1 (고정 이름)
  CONTAINER_2_NAME: p-14044-1_2      # 슬롯 2 (고정 이름)
  CONTAINER_PORT: 8080               # 컨테이너 내부 포트
  EC2_INSTANCE_TAG_NAME: terra-ec2-1
  DOCKER_NETWORK: common
  BACKEND_DIR: back

# 커밋이 몰려도 배포는 하나씩. 진행 중인 배포는 끝까지 보장
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - ".github/workflows/**"
      - "back/src/**"
      - "back/build.gradle.kts"
      - "back/settings.gradle.kts"
      - "back/Dockerfile"
    branches:
      - main

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------
  # 1) 버전 태그 + 릴리즈 생성
  # ---------------------------------------------------------
  makeTagAndRelease:
    name: 태그와 릴리즈 생성
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.create_tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 버전 태그 생성
        id: create_tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 릴리즈 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.create_tag.outputs.new_tag }}
          CHANGELOG: ${{ steps.create_tag.outputs.changelog }}
        run: |
          printf '%s' "$CHANGELOG" > /tmp/notes.md
          gh release create "$TAG" --title "Release $TAG" --notes-file /tmp/notes.md

  # ---------------------------------------------------------
  # 2) 도커 이미지 빌드 / 푸시
  # ---------------------------------------------------------
  buildImageAndPush:
    name: 도커 이미지 빌드와 푸시
    needs: makeTagAndRelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env 파일 생성
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: |
          mkdir -p "${{ env.BACKEND_DIR }}"
          printf "%s" "${DOT_ENV}" > "${{ env.BACKEND_DIR }}/.env"

      - name: 소유자명 소문자로 변환
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "OWNER_LC=${OWNER,,}" >> "${GITHUB_ENV}"

      - name: Docker Buildx 설치
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드 앤 푸시
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_REPOSITORY }}:${{ needs.makeTagAndRelease.outputs.tag_name }}
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_REPOSITORY }}:latest

  # ---------------------------------------------------------
  # 3) Blue/Green 무중단 배포
  # ---------------------------------------------------------
  deploy:
    name: Blue/Green 무중단 배포
    needs: [makeTagAndRelease, buildImageAndPush]
    runs-on: ubuntu-latest
    steps:
      - name: AWS 자격증명 구성
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: EC2 인스턴스 ID 조회
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.EC2_INSTANCE_TAG_NAME }}" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          [[ -n "$INSTANCE_ID" && "$INSTANCE_ID" != "None" ]] \
            || { echo "실행 중인 인스턴스를 찾지 못했습니다"; exit 1; }
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "대상 인스턴스: $INSTANCE_ID"

      - name: 원격 배포 스크립트 작성
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ needs.makeTagAndRelease.outputs.tag_name }}
        run: |
          OWNER_LC="${OWNER,,}"
          PREFIX="ghcr.io/${OWNER_LC}/${{ env.IMAGE_REPOSITORY }}"
          {
            # --- 러너에서 값이 치환되는 구간 ---
            echo "IMAGE='${PREFIX}:${IMAGE_TAG}'"
            echo "IMAGE_PREFIX='${PREFIX}'"
            echo "IMAGE_TAG='${IMAGE_TAG}'"
            echo "SLOT1='${{ env.CONTAINER_1_NAME }}'"
            echo "SLOT2='${{ env.CONTAINER_2_NAME }}'"
            echo "PORT_IN='${{ env.CONTAINER_PORT }}'"
            echo "NET='${{ env.DOCKER_NETWORK }}'"
            # --- EC2 에서 그대로 실행될 구간 ---
            cat <<'SCRIPT'
          set -Eeuo pipefail

          LOG="/tmp/ssm-$(date +%Y%m%d_%H%M%S).log"
          exec > >(awk '{ fflush(); print strftime("[%Y-%m-%d %H:%M:%S]"), $0 }' | tee -a "$LOG")
          exec 2>&1

          source /etc/environment || true
          NPM="https://127.0.0.1:81"
          JAR="$(mktemp)"
          trap 'rm -f "$JAR"' EXIT

          echo "배포 이미지: ${IMAGE}"
          docker pull "${IMAGE}"

          # ---- 1) npmplus 로그인 : 토큰은 HttpOnly 쿠키로 온다 ----
          HTTP=$(curl -sk -c "$JAR" -o /dev/null -w '%{http_code}' \
            -X POST "${NPM}/api/tokens" \
            -H "Content-Type: application/json" \
            -d "{\"identity\":\"admin@npm.com\",\"secret\":\"${PASSWORD_1:-}\"}")
          [ "$HTTP" = "200" ] || { echo "NPM 로그인 실패 (HTTP $HTTP)"; exit 1; }
          grep -q 'Http-token' "$JAR" || { echo "NPM 토큰 쿠키를 받지 못했습니다"; exit 1; }

          # ---- 2) 대상 프록시 호스트 찾기 ----
          [ -n "${APP_1_DOMAIN:-}" ] || { echo "APP_1_DOMAIN 이 비어 있습니다"; exit 1; }
          PROXY_ID=$(curl -sk -b "$JAR" "${NPM}/api/nginx/proxy-hosts" \
            | jq -r --arg d "$APP_1_DOMAIN" '.[] | select(.domain_names[]==$d) | .id')
          [ -n "$PROXY_ID" ] && [ "$PROXY_ID" != "null" ] \
            || { echo "프록시 호스트를 찾지 못했습니다: $APP_1_DOMAIN"; exit 1; }

          CURRENT=$(curl -sk -b "$JAR" "${NPM}/api/nginx/proxy-hosts/${PROXY_ID}" \
            | jq -r '.forward_host')
          echo "현재 업스트림: ${CURRENT}"

          # ---- 3) blue(현재) / green(다음) 역할 판정 ----
          if [ "$CURRENT" = "$SLOT1" ]; then
            BLUE="$SLOT1"; GREEN="$SLOT2"
          elif [ "$CURRENT" = "$SLOT2" ]; then
            BLUE="$SLOT2"; GREEN="$SLOT1"
          else
            BLUE="none";  GREEN="$SLOT1"
          fi
          echo "blue(현재)=${BLUE}   green(다음)=${GREEN}"

          # ---- 4) green 컨테이너 기동 ----
          docker rm -f "$GREEN" >/dev/null 2>&1 || true
          docker run -d --name "$GREEN" \
            --restart unless-stopped \
            --network "$NET" \
            -e TZ=Asia/Seoul \
            "$IMAGE"

          # ---- 5) 헬스체크 : 200 나올 때까지 대기 ----
          echo "헬스체크 시작: ${GREEN}"
          TIMEOUT=180; INTERVAL=3; ELAPSED=0; CODE=000
          sleep 10
          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            CODE=$(docker exec "$GREEN" curl -s -o /dev/null -w '%{http_code}' \
                  "http://127.0.0.1:${PORT_IN}/actuator/health" 2>/dev/null || echo 000)
            [ "$CODE" = "200" ] && break
            sleep "$INTERVAL"; ELAPSED=$((ELAPSED + INTERVAL))
          done
          if [ "$CODE" != "200" ]; then
            echo "헬스체크 실패(${CODE}) - 전환하지 않고 중단합니다. ${BLUE} 가 계속 서비스합니다"
            docker logs --tail=200 "$GREEN" || true
            docker rm -f "$GREEN" || true
            exit 1
          fi
          echo "green 정상 (${ELAPSED}초 소요)"

          # ---- 6) 업스트림 전환 : 기존 설정을 보존한 채 forward_host 만 교체 ----
          CUR_JSON=$(curl -sk -b "$JAR" "${NPM}/api/nginx/proxy-hosts/${PROXY_ID}")
          NEW_JSON=$(echo "$CUR_JSON" | jq --arg h "$GREEN" --argjson p "$PORT_IN" \
            'del(.id, .created_on, .modified_on, .owner_user_id)
             | .forward_host = $h
             | .forward_port = $p')
          RESP=$(curl -sk -b "$JAR" -X PUT "${NPM}/api/nginx/proxy-hosts/${PROXY_ID}" \
            -H "Content-Type: application/json" -d "$NEW_JSON")
          AFTER=$(echo "$RESP" | jq -r '.forward_host // empty')
          [ "$AFTER" = "$GREEN" ] || { echo "업스트림 전환 실패: $RESP"; exit 1; }
          echo "업스트림 전환 완료 -> ${GREEN}:${PORT_IN}"

          # ---- 7) 이전 blue 제거 ----
          if [ "$BLUE" != "none" ]; then
            sleep 5
            docker stop "$BLUE" >/dev/null 2>&1 || true
            docker rm   "$BLUE" >/dev/null 2>&1 || true
            echo "이전 blue 제거: ${BLUE}"
          fi

          # ---- 8) 옛 이미지 정리 ----
          {
            docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep -F "${IMAGE_PREFIX}:" \
              | grep -v -F ":${IMAGE_TAG}" \
              | grep -v -F ":latest" \
              | xargs -r docker rmi
          } || true

          echo "배포 완료. 현재 서비스 중 = ${GREEN}"
          SCRIPT
          } > /tmp/deploy.sh

      - name: SSM 으로 원격 실행
        run: |
          jq -Rs '{commands: [.]}' /tmp/deploy.sh > /tmp/params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "BlueGreen ${{ needs.makeTagAndRelease.outputs.tag_name }}" \
            --parameters file:///tmp/params.json \
            --timeout-seconds 600 \
            --query "Command.CommandId" --output text)
          echo "CommandId: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          echo "----- 원격 출력 -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          echo "----- 원격 오류 -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "원격 실행 상태: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1